<div class="lang-group">

    <a href="{{ url }}"
       class="btn btn-sm"
       title="Principal: usa Python y, si no responde, pasa al siguiente lenguaje">
        {{ texto }} con Python
    </a>

    <a href="{{ url }}?lang=java" class="btn btn-sm btn-java">
        {{ texto }} con Java
    </a>

    <a href="{{ url }}?lang=js" class="btn btn-sm btn-js">
        {{ texto }} con JS
    </a>

    <a href="{{ url }}?lang=go" class="btn btn-sm btn-go">
        {{ texto }} con Go
    </a>

</div>

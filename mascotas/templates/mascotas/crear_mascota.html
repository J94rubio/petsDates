{% extends 'mascotas/base.html' %}

{% block title %}
    Registrar mascota
{% endblock %}

{% block content %}

    <h2>Registrar nueva mascota</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        {% include 'mascotas/_botones_guardar.html' with texto='Guardar mascota' %}

    </form>

    <br>

    <a href="{% url 'lista_mascotas' %}">
        Cancelar
    </a>

{% endblock %}

<div class="lang-group">

    <button type="submit"
            name="lang"
            value="python"
            class="btn btn-sm"
            title="Principal: usa Python y, si no responde, pasa al siguiente lenguaje">
        {{ texto }} con Python
    </button>

    <button type="submit" name="lang" value="java" class="btn btn-sm btn-java">
        {{ texto }} con Java
    </button>

    <button type="submit" name="lang" value="js" class="btn btn-sm btn-js">
        {{ texto }} con JS
    </button>

    <button type="submit" name="lang" value="go" class="btn btn-sm btn-go">
        {{ texto }} con Go
    </button>

</div>
